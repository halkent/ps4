<!DOCTYPE html>
<html lang="tr" manifest="cache.manifest">
<head>
    
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>HALKENT // PS4 11.00-13.00 HOST / 2.4B18.12</title>
<style>
    :root {
        --bg: #080d17;
        --panel: #101a2b;
        --panel-2: #242424;
        --line: #2e2e2e;
        --line-bright: #454545;
        --text: #f5f5f5;
        --muted: #b5b5b5;
        --dim: #828282;
        --accent: #65ccf8;
        --red: #ff9b9b;
        --amber: #e1bd72;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    html { background: var(--bg); }
    html, body { min-height: 100%; }
    body {
        background-color: var(--bg);
        background-image: linear-gradient(rgba(162, 148, 255, .05) 1px, transparent 1px),
            linear-gradient(90deg, rgba(162, 148, 255, .05) 1px, transparent 1px);
        background-size: 36px 36px;
        color: var(--text);
        display: flex;
        flex-direction: column;
        font: 17px/1.4 Consolas, "Liberation Mono", monospace;
        min-height: 100vh;
        overflow-x: hidden;
    }
    a { color: inherit; }

    .app { display: flex; flex: 1 0 auto; flex-direction: column; margin: 0 auto; padding: 14px 26px 12px; width: min(100% - 52px, 1220px); }

    /* Top status bar */
    .bar {
        align-items: center;
        border: 1px solid var(--line-bright);
        display: flex;
        font-size: 14px;
        justify-content: space-between;
        letter-spacing: .1em;
        padding: 10px 16px;
        text-transform: uppercase;
    }
    .bar b { color: var(--accent); font-weight: 400; }
    .bar-fw { color: var(--dim); }
    .bar-fw::before { color: var(--accent); content: "\25CF "; }

    .layout { display: flex; flex: 1 0 auto; flex-direction: column; padding: 20px 0 0; }

    /* Header */
    .kicker { color: var(--accent); font-size: 14px; letter-spacing: .14em; margin: 0 0 12px; }
    h1 { font-size: clamp(34px, 5vw, 56px); font-weight: 400; letter-spacing: -.07em; line-height: 1; margin: 0; }
    h1 em { color: var(--accent); font-style: normal; }
    .sub { color: var(--muted); font-size: 17px; margin: 13px 0 0; max-width: 720px; }
    .boot { color: var(--dim); font-size: 14px; list-style: none; margin: 12px 0 0; }
    .boot li { margin: 3px 0; }
    .boot b { color: var(--accent); font-weight: 400; }

    /* Router status */
    .status {
        background: var(--panel);
        border: 1px solid var(--line);
        margin-top: 20px;
        padding: 14px 16px;
    }
    #state { color: var(--accent); font-size: 22px; font-weight: 400; line-height: 1.25; margin: 0 0 10px; }
    #det { color: var(--muted); font-size: 14px; margin: 0 0 6px; }
    #det b { color: var(--text); font-weight: 400; }
    #cache { color: var(--dim); font-size: 13px; margin: 0 0 10px; min-height: 16px; }
    #cache.cacheok { color: var(--accent); }
    .ok { color: var(--accent); }
    .bad { color: var(--red); }
    .warn { color: var(--amber); }
    .notice { border-left: 2px solid var(--amber); color: var(--muted); font-size: 13px; margin-top: 12px; padding: 5px 10px; }
    .notice b { color: var(--amber); font-weight: 400; }

    
    
    
    
    .np-label { color: var(--dim); display: block; font-size: 12px; letter-spacing: .12em; text-transform: uppercase; }
    .np-name { color: var(--text); display: block; font-size: 24px; margin-top: 2px; }
    .np-name b { color: var(--accent); font-weight: 400; }
    .np-open { color: var(--accent); font-size: 14px; }

    /* Footer */
    .foot {
        border-top: 1px solid var(--line);
        color: var(--dim);
        font-size: 13px;
        margin-top: 16px;
        padding: 12px 4px 2px;
        text-align: center;
    }
    .foot a { color: var(--muted); }
    .foot a:hover, .foot a:focus { color: var(--accent); }

    @media (max-width: 760px) {
        body { overflow: auto; }
        .app { padding: 8px 10px; width: min(100% - 20px, 560px); }
        .bar { font-size: 12px; padding: 8px 12px; }
        .layout { padding-top: 14px; }
        h1 { font-size: 38px; }
        .sub { font-size: 16px; }
        #state { font-size: 19px; }
    }
</style>

<style id="halkent-host-background">
html{background:#080f20!important}
body{background-color:#080f20!important;background-image:radial-gradient(ellipse at 12% 42%,rgba(15,124,159,.32),transparent 55%),radial-gradient(ellipse at 88% 64%,rgba(95,55,157,.30),transparent 55%),linear-gradient(135deg,#061420,#0d152d 55%,#140f25)!important;background-size:100% 100%!important;background-repeat:no-repeat!important;background-attachment:fixed!important;color:#eef4ff}
:root{--dim:#9eafc6;--faint:#8da1bd;--muted:#afc0d8}
.subtitle,.description,.foot{color:#aabdd5}
</style>
<style id="full-brand-logo">img.hg-full-logo{display:inline-block;width:260px;max-width:100%;height:auto;vertical-align:middle;margin:-10px 0;border:0}.brand,.service-brand{flex-shrink:0}.brand img.hg-full-logo{width:260px;height:auto}.service-brand img.hg-full-logo{width:260px;height:auto}@media(max-width:600px){img.hg-full-logo,.brand img.hg-full-logo,.service-brand img.hg-full-logo{width:200px}}@media(max-width:380px){img.hg-full-logo,.brand img.hg-full-logo,.service-brand img.hg-full-logo{width:165px}}</style><link rel="icon" type="image/png" href="../hg-favicon.png?v=hg1"></head>
<body>
    <div class="app">
        <header class="bar">
            <a href="../index.html"><img class="hg-full-logo" src="../halkent-gaming-lounge.png" alt="Halkent Gaming Lounge" width="260" height="87"></a>
            <span class="bar-fw">Sürüm 11.00-13.00 hazır</span>
        </header>

        <main class="layout">
            <p class="kicker">$ ./launch --slopkit</p>
            <h1>SlopKit <em>11.00-13.00</em> merkezi</h1>
            <p class="sub">Halkent PS4 merkezi.</p>
            <ul class="boot">
                <li>[ <b>ok</b> ] WebKit hazır</li>
                <li>[ <b>ok</b> ] Çevrimdışı önbellek hazır</li>
            </ul>

            <section class="status" id="wrap">
                <div id="state">Sistem sürümü algılanıyor...</div>
                <div id="det"></div>
                <div id="cache"></div>
            </section>

            

            <footer class="foot">
                Kaynak: <a href="https://t.me/sudoBlackArch">BlackArch</a> // <a href="https://t.me/PlayStation_Pulse">Topluluk</a>
            </footer>
        </main>
    </div>

<script>
(function () {
    var stateEl = document.getElementById("state");
    var detEl = document.getElementById("det");
    var cacheEl = document.getElementById("cache");
    var launched = false;
    var cacheFinished = false;
    var cacheWatchdog = null;

    function setState(text, cssClass) {
        stateEl.textContent = text;
        stateEl.className = cssClass || "";
    }
    function setCache(text, ok) {
        cacheEl.textContent = text;
        cacheEl.className = ok ? "cacheok" : "";
    }
    function queryValue(name) {
        var match = new RegExp("[?&]" + name + "=([^&]*)").exec(location.search);
        if (!match) return null;
        try { return decodeURIComponent(match[1]); } catch (error) { return null; }
    }
    function sessionGet(name) {
        try { return sessionStorage.getItem(name); } catch (error) { return null; }
    }
    function sessionSet(name, value) {
        try {
            sessionStorage.setItem(name, String(value));
            return sessionStorage.getItem(name) === String(value);
        } catch (error) { return false; }
    }
    function sessionRemove(name) {
        try { sessionStorage.removeItem(name); } catch (error) {}
    }

    var key = null;
    var fwnum = null;
    var match = /PlayStation\s+4[\/ ](\d+)\.(\d+)/.exec(navigator.userAgent);
    if (match) {
        var minor = parseInt(match[2], 16);
        var minorString = minor.toString(16);
        if (minorString.length < 2) minorString = "0" + minorString;
        key = match[1] + "." + minorString;
        fwnum = parseInt(match[1], 10) * 100 + parseInt(minorString, 10);
    }

    if (fwnum === 1101 || fwnum === 1102) {
        window.location.replace("../css/version-selector.html");
        return;
    }

    var LAPSE = { 1100: 1, 1150: 1, 1152: 1, 1200: 1, 1202: 1 };
    var POOPS = { 1250: 1, 1252: 1, 1300: 1 };
    var bug = LAPSE[fwnum] ? "lapse" : (POOPS[fwnum] ? "poops" : null);
    var forced = queryValue("bug");
    if (bug && (forced === "lapse" || forced === "poops")) bug = forced;

    var why = !key ? "PS4 tarayıcısı algılanamadı" :
        bug ? key + " için yöntem: " + bug : key + " bu sayfada desteklenmiyor";
    detEl.innerHTML = "Sistem sürümü <b>" + (key || "algılanamadı") + "</b>"
        + " &middot; bug <b>" + (bug || "none") + "</b> &middot; " + why;

    if (!bug) {
        setState((/PlayStation\s+4[\/ ]/i.test(navigator.userAgent) ? "Bu sistem sürümü desteklenmiyor — işlem durduruldu" : "Bu sayfayı PS4 tarayıcısında açın"), "bad");
        setCache("Desteklenen sürümler: 11.00, 11.50, 11.52, 12.00, 12.02, 12.50, 12.52 ve 13.00.");
        return;
    }

    var target = (bug === "lapse" ? "run_lapse.html" : "run_poops.html")
        + location.search;
    var preflightKey = "halkent-1300-preflight:" + target;
    var cacheReloadKey = "halkent-1300-cache-reload";

    function waitForTap(message, action) {
        setState(message, "warn");
        var fired = false;
        function cleanup() {
            window.removeEventListener("click", click, false);
            window.removeEventListener("keydown", keydown, false);
        }
        function fire() {
            if (fired) return;
            fired = true;
            cleanup();
            action();
        }
        function click() { fire(); }
        function keydown(event) {
            var code = event.which || event.keyCode || 0;
            var keyName = event.key || event.keyIdentifier || "";
            if (code === 13 || code === 32 || keyName === "Enter" ||
                keyName === " " || keyName === "Spacebar") {
                event.preventDefault();
                fire();
            }
        }
        window.addEventListener("click", click, false);
        window.addEventListener("keydown", keydown, false);
    }

    function go() {
        if (launched) return;
        launched = true;
        if (sessionGet(preflightKey) !== "yes") {
            if (!sessionSet(preflightKey, "yes")) {
                setState("OTURUM BELLEĞİ KULLANILAMIYOR — devam etmek için X tuşuna basın", "warn");
                waitForTap("OTURUM BELLEĞİ KULLANILAMIYOR — devam etmek için X tuşuna basın", function () {
                    location.replace(target);
                });
                return;
            }
            setState("Bellek hazırlanıyor...", "warn");
            setTimeout(function () { location.reload(); }, 750);
            return;
        }
        setState(bug + " işlemi yükleniyor...", "warn");
        location.replace(target);
    }

    function finishCache() {
        if (cacheFinished) return false;
        cacheFinished = true;
        if (cacheWatchdog !== null) {
            clearTimeout(cacheWatchdog);
            cacheWatchdog = null;
        }
        return true;
    }

    function reloadWithFreshCache(swap) {
        if (!finishCache()) return;
        if (swap) {
            try { applicationCache.swapCache(); } catch (error) {}
        }
        sessionSet(preflightKey, "yes");
        if (sessionGet(cacheReloadKey) === "yes") {
            sessionRemove(cacheReloadKey);
            go();
            return;
        }
        sessionSet(cacheReloadKey, "yes");
        setCache("Önbellek hazır — sayfa yenileniyor", true);
        setTimeout(function () { location.reload(); }, 750);
    }

    var ac = window.applicationCache;
    if (!ac || !document.documentElement.hasAttribute("manifest")) {
        if (bug === "poops") {
            // Poops must only run from the offline cache: an uncached run
            // fetches payload/kpatch over the network right before a
            // timing-sensitive race. Fail closed like upstream instead.
            setCache("Önbellek gerekli — tarayıcı verilerini temizleyip sayfayı yeniden açın");
            setState("ÖNBELLEK KULLANILAMIYOR — tarayıcı verilerini temizleyip sayfayı yeniden açın", "bad");
            return;
        }
        setCache("Uygulama önbelleği kullanılamıyor");
        go();
        return;
    }

    ac.addEventListener("downloading", function () {
        setCache("Çevrimdışı kullanım için kaydediliyor...");
    }, false);
    ac.addEventListener("progress", function (event) {
        if (event && event.total > 0)
            setCache("Kaydediliyor: %" + Math.round(event.loaded / event.total * 100) + "%");
    }, false);
    ac.addEventListener("cached", function () {
        reloadWithFreshCache(false);
    }, false);
    ac.addEventListener("updateready", function () {
        reloadWithFreshCache(true);
    }, false);
    ac.addEventListener("noupdate", function () {
        if (!finishCache()) return;
        sessionRemove(cacheReloadKey);
        setCache("Önbellek hazır — çevrimdışı kullanılabilir", true);
        go();
    }, false);
    ac.addEventListener("error", function () {
        if (!finishCache()) return;
        sessionRemove(cacheReloadKey);
        setCache("Önbellek kullanılamıyor");
        if (bug === "poops") {
            // No online fallback for poops: running uncached adds network
            // jitter to the triple-free race. Upstream stops here too.
            setState("ÖNBELLEK HATASI — tarayıcı verilerini temizleyip sayfayı yeniden açın", "bad");
            return;
        }
        waitForTap("ÖNBELLEK HATASI — çevrimiçi devam etmek için X tuşuna basın veya dokunun", go);
    }, false);
    ac.addEventListener("obsolete", function () {
        if (!finishCache()) return;
        sessionRemove(cacheReloadKey);
        setCache("Önbellek güncel değil — tarayıcı verilerini temizleyin", false);
        setState("ÖNBELLEK GÜNCEL DEĞİL — tarayıcı verilerini temizleyip sayfayı yeniden açın", "bad");
    }, false);

    if (!navigator.onLine) {
        finishCache();
        setCache("Çevrimdışı — önbellekteki dosyalar kullanılıyor", true);
        go();
    } else if (ac.status === ac.UPDATEREADY) {
        reloadWithFreshCache(true);
    } else if (ac.status === ac.CHECKING || ac.status === ac.DOWNLOADING ||
               ac.status === ac.UNCACHED) {
        setCache("Çevrimdışı önbellek bekleniyor...");
        cacheWatchdog = setTimeout(function () {
            if (!finishCache()) return;
            setCache("Önbellek kontrolü zaman aşımına uğradı");
            if (bug === "poops") {
                setState("ÖNBELLEK ZAMAN AŞIMI — tarayıcı verilerini temizleyip sayfayı yeniden açın", "bad");
                return;
            }
            waitForTap("ÖNBELLEK ZAMAN AŞIMI — çevrimiçi devam etmek için X tuşuna basın veya dokunun", go);
        }, 60000);
    } else {
        setCache("Önbellek hazır — güncellemeler kontrol ediliyor...");
        try { ac.update(); } catch (error) {}
        cacheWatchdog = setTimeout(function () {
            if (!finishCache()) return;
            sessionRemove(cacheReloadKey);
            setCache("Önbellek hazır — çevrimdışı kullanılabilir", true);
            go();
        }, 5000);
    }
}());
</script>
