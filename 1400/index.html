<!doctype html>
<html lang="tr" manifest="cache.appcache"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Halkent | GoldHEN</title><style>
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        min-height: 100%;
        background: #05070d;
        color: #eef4ff;
        font-family: "Segoe UI", Arial, sans-serif;
      }
      body {
        min-height: 100vh;
        overflow: hidden;
        background: #080f20;
        background-image:
          radial-gradient(ellipse at 12% 42%, rgba(15, 124, 159, 0.32), transparent 55%),
          radial-gradient(ellipse at 88% 64%, rgba(95, 55, 157, 0.30), transparent 55%),
          linear-gradient(135deg, #061420, #0d152d 55%, #140f25);
      }
      body:before,
      body:after {
        content: "";
        position: fixed;
        pointer-events: none;
        border-radius: 50%;
        opacity: 0.45;
      }
      body:before {
        width: 145vw;
        height: 85vh;
        left: -30vw;
        top: 40vh;
        border: 1px solid rgba(88, 211, 231, 0.20);
        box-shadow: 0 -28px 85px rgba(27, 160, 190, 0.08);
        transform: rotate(-18deg);
      }
      body:after {
        width: 135vw;
        height: 88vh;
        right: -35vw;
        bottom: 42vh;
        border: 1px solid rgba(150, 127, 224, 0.16);
        transform: rotate(-18deg);
      }
      .grid {
        display: none;
      }
      .shell {
        position: relative;
        z-index: 1;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
      }
      #brand {
        height: 74px;
        padding: 0 38px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        background: rgba(5, 8, 16, 0.9);
        border-bottom: 1px solid #202d45;
      }
      .logo {
        display: flex;
        align-items: center;
        gap: 12px;
      }
      .brand-logo {
        width: 62px;
        height: 58px;
        object-fit: contain;
        filter: drop-shadow(0 0 10px rgba(48, 157, 255, 0.3));
      }
      .logo strong {
        font-size: 20px;
        letter-spacing: 0.13em;
      }
      .logo strong span {
        color: #4ba3ff;
      }
      .badge {
        padding: 8px 14px;
        border: 1px solid #263b5d;
        border-radius: 20px;
        color: #99b6dc;
        font-size: 12px;
        letter-spacing: 0.08em;
        background: #0c1422;
      }
      .stage {
        flex: 1;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 28px;
      }
      .card {
        width: 670px;
        max-width: 94vw;
        padding: 44px;
        text-align: center;
        background: rgba(10, 15, 27, 0.94);
        border: 1px solid #253653;
        border-radius: 24px;
        box-shadow: 0 24px 80px rgba(0, 0, 0, 0.5);
      }
      .tag {
        display: inline-block;
        padding: 8px 14px;
        margin-bottom: 24px;
        border-radius: 8px;
        background: #101d33;
        color: #60acff;
        font-size: 12px;
        font-weight: 700;
        letter-spacing: 0.12em;
      }
      #spin {
        display: none;
        position: relative;
        width: 76px;
        height: 76px;
        margin: 0 auto 25px;
        border: 5px solid #17263d;
        border-top-color: #258dff;
        border-right-color: #884cff;
        border-radius: 50%;
        animation: spin 0.9s linear infinite;
        box-shadow: 0 0 35px rgba(37, 141, 255, 0.12);
      }
      #spin:after {
        content: "";
        position: absolute;
        inset: 15px;
        border-radius: 50%;
        background: #15243b;
      }
      @keyframes spin {
        to { transform: rotate(360deg); }
      }
      #startJb {
        display: flex;
        align-items: center;
        justify-content: center;
        min-width: 220px;
        min-height: 70px;
        padding: 16px 34px;
        border: 0;
        border-radius: 14px;
        background: linear-gradient(135deg, #258dff, #884cff);
        color: #fff;
        font-size: 28px;
        font-weight: 800;
        letter-spacing: 0.08em;
        cursor: pointer;
        margin: 0 auto;
        box-shadow: 0 12px 35px rgba(37, 141, 255, 0.25);
        transition: transform 0.15s ease, filter 0.15s ease;
      }
      #startJb:hover {
        filter: brightness(1.1);
        transform: translateY(-2px);
      }
      #startJb:active {
        transform: translateY(0);
      }
      #startJb:disabled {
        opacity: 0.7;
        cursor: wait;
      }
      .main-title {
        display: none;
        font-size: 28px;
        font-weight: 750;
        margin-bottom: 10px;
      }
      .hint {
        display: none;
        color: #8294b0;
        font-size: 14px;
      }
      .steps {
        display: none;
        justify-content: center;
        gap: 8px;
        margin-top: 30px;
      }
      .steps i {
        width: 38px;
        height: 4px;
        border-radius: 3px;
        background: #1e304b;
      }
      .steps i:first-child {
        background: #278cff;
      }
      .steps i:nth-child(2) {
        background: #504fcc;
      }
      #msg,
      #success {
        display: none;
        margin-top: 12px;
        font-size: 18px;
        font-weight: 700;
        line-height: 1.5;
      }
      #msg { color: #ff7c87; font-size: 22px; }
      #success { color: #55d998; font-size: 24px; }
      .result-line { font-size: inherit; font-weight: inherit; }
      .failure-note {
        display: block;
        margin-top: 18px;
        color: #b8c8de;
        font-size: 13px;
        font-weight: 400;
      }
      #wrap {
        padding: 0;
      }
      #state,
      #out {
        display: none;
      }
      body.done #spin,
      body.fail #spin {
        display: none !important;
      }
      body.done #startJb,
      body.fail #startJb {
        display: none !important;
      }
      body.fail #msg {
        display: block;
      }
      body.done #success {
        display: block;
      }
      body.done .main-title,
      body.done .hint,
      body.done .steps,
      body.fail .main-title,
      body.fail .hint,
      body.fail .steps {
        display: none;
      }
      body.log {
        overflow: auto;
      }
      body.log .stage {
        display: block;
        padding: 20px 28px;
      }
      body.log .card {
        width: auto;
        max-width: none;
        padding: 24px;
        text-align: left;
      }
      body.log #spin,
      body.log #msg,
      body.log .main-title,
      body.log .hint,
      body.log .steps,
      body.log .tag {
        display: none;
      }
      body.log #state {
        display: block;
        font-size: 22px;
        font-weight: 700;
        margin: 0 0 12px;
      }
      body.log #out {
        display: block;
        white-space: pre-wrap;
        font:
          12px/1.5 Consolas,
          monospace;
        background: #080d17;
        border: 1px solid #233553;
        border-radius: 10px;
        padding: 15px;
        height: calc(100vh - 170px);
        overflow-y: auto;
      }
      .ok,
      .safe {
        color: #55d998;
      }
      .bad,
      .danger {
        color: #ff6d7a;
      }
      .warn {
        color: #ffc45c;
      }
      code {
        color: #9fc5fa;
      }
      footer {
        padding: 17px;
        text-align: center;
        color: #52647f;
        font-size: 11px;
        letter-spacing: 0.08em;
      }
      @media (max-width: 600px) {
        #brand {
          padding: 0 18px;
        }
        .badge {
          display: none;
        }
        .card {
          padding: 34px 20px;
        }
        .main-title {
          font-size: 23px;
        }
      }
    
#spin {display:block;} .main-title,.hint {display:block;}
#msg {white-space:pre-line;} body.done #msg {display:block;color:#55d998;font-size:24px;}
body.done .main-title,body.fail .main-title,body.done .hint,body.fail .hint {display:none;}
#ramBox {color:#8294b0;font:11px Consolas,monospace;margin:18px 0;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;}
#cacheStatus {color:#99b6dc;font-size:14px;margin-top:22px;}
.notice {margin:20px 0;padding:16px;border:1px solid #ff6d7a;border-radius:12px;color:#ff9ba4;white-space:pre-line;}
body.log #out {height:48vh;} body.log #ramBox {display:block;}
body {overflow:auto;} .credit {font-size:11px;color:#8294b0;margin-top:12px;}
body.waiting #spin,body.waiting .main-title,body.waiting .hint,body.waiting #ramBox {display:none;}

/* One visible text node; no success layout or document switch. */
body:not(.waiting) .main-title,
body:not(.waiting) .hint, body:not(.waiting) #ramBox,
body:not(.waiting) #cacheStatus, #success, #msg {display:none !important;}
#out {display:block !important;white-space:pre-line;text-align:center;color:#55d998;font:700 24px/1.6 Arial,sans-serif;}
body.waiting #wrap {display:none;}

body:not(.waiting) #spin {display:block !important;-webkit-animation:spin .9s linear infinite;}
body.waiting #spin {display:none !important;}
body.fail #spin {visibility:hidden;-webkit-animation:none;animation:none;}
@-webkit-keyframes spin {to {-webkit-transform:rotate(360deg);}}
#transitionSpinner{width:48px;height:48px;margin:0 auto 22px;border:4px solid #243851;border-top-color:#65ccf8;border-radius:50%;animation:spin 1s linear infinite;-webkit-animation:spin 1s linear infinite}#transitionTitle{font-size:26px;margin:0 0 12px}body.stopped #transitionSpinner,body.stopped #transitionHint{display:none}</style>

</head><body class="waiting"><div class="grid"></div><div class="shell"><div id="brand"><div class="logo"><img class="brand-logo" src="../halkent.svg" alt="Halkent"><strong>HAL<span>KENT</span></strong></div><div class="badge">PS4 13.52 / 14.00 • GoldHEN</div></div><main class="stage"><section class="card"><div id="transitionSpinner" aria-hidden="true"></div><h1 id="transitionTitle">Hazırlanıyor…</h1><p id="transitionHint" style="color:#99b6dc">Dosyalar hazır olduğunda işlem otomatik başlayacak.</p><div id="cacheStatus" role="status">Çevrimdışı dosyalar kontrol ediliyor...</div></section></main><footer>Halkent TEKNİK SERVİS • PS4 13.52 / 14.00 · <a href="https://github.com/halkent/ps4/tree/main/1400" style="color:inherit">Kaynak kodu ve lisanslar</a></footer></div><script>
(function () {
  var status = document.getElementById("cacheStatus");
  var title = document.getElementById("transitionTitle");
  var leaving = false;
  function show(message) { status.textContent = message; }
  function stop(heading, message) {
    document.body.className = "waiting stopped";
    title.textContent = heading;
    show(message);
  }
  var match = (navigator.userAgent || "").match(/PlayStation\s+4[\/ ](\d+\.\d+)/);
  if (!match) {
    stop("PS4 tarayıcısında açın", "Bu işlem bilgisayar veya telefon tarayıcısında çalışmaz. PS4 üzerinde aynı adresi açın.");
    return;
  }
  if (match[1] !== "13.52" && match[1] !== "14.00") {
    stop("Bu sistem sürümü desteklenmiyor", "Algılanan sürüm: " + match[1] + ". Bu sayfa yalnızca PS4 13.52 ve 14.00 içindir.");
    return;
  }
  var cache = window.applicationCache;
  if (!cache) {
    stop("Önbellek kullanılamıyor", "PS4 tarayıcısı çevrimdışı önbelleği desteklemiyor. İşlem başlatılmadı.");
    return;
  }
  function ready() {
    if (leaving) return;
    leaving = true;
    title.textContent = "İşlem başlatılıyor…";
    show("Dosyalar hazır. Lütfen bekleyin.");
    setTimeout(function () {
      location.replace("jb.html?log=1&afterglow=run&mode=goldhen");
    }, 250);
  }
  function failed() {
    if (leaving) return;
    if (cache.status === cache.IDLE) ready();
    else stop("Hazırlık tamamlanamadı", "İnternet bağlantısını kontrol edip sayfayı yenileyin. İşlem başlatılmadı.");
  }
  cache.addEventListener("checking", function () { show("Çevrimdışı dosyalar kontrol ediliyor..."); });
  cache.addEventListener("downloading", function () { show("Çevrimdışı dosyalar kaydediliyor..."); });
  cache.addEventListener("progress", function (event) {
    if (event.total) show("Çevrimdışı dosyalar kaydediliyor: %" + Math.round(event.loaded / event.total * 100));
  });
  cache.addEventListener("cached", ready);
  cache.addEventListener("noupdate", ready);
  function applyUpdate() {
    if (leaving) return;
    try { cache.swapCache(); } catch (error) {
      stop("Güncelleme uygulanamadı", "Sayfayı yenileyin. İşlem başlatılmadı.");
      return;
    }
    ready();
  }
  cache.addEventListener("updateready", applyUpdate);
  cache.addEventListener("error", failed);
  cache.addEventListener("obsolete", function () {
    if (!leaving) stop("Önbellek güncel değil", "PS4 tarayıcı verilerini temizleyip bu sayfayı yeniden açın.");
  });
  if (cache.status === cache.UPDATEREADY) applyUpdate();
})();
</script></body></html>
