<!doctype html>
<html lang="tr" manifest="cache.appcache">
  <head>
    <meta charset="utf-8" /><script>window.hkT=function(value){return value;};</script><link rel="stylesheet" href="../i18n/menu.css"><script src="../i18n/menu.js" data-root="../i18n/"></script>
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>PS4 14.02 · Halkent</title>
    <!-- This page carries its own styles and starts its own module, and it
         loads NOTHING else. That duplicates a little of style.css, and it is
         deliberate: every subresource is one more allocation and one more
         timing shift in the process that core.js is about to groom, and this
         exploit is decided by exactly that. The landing page may use the
         shared stylesheet; this one may not. -->
    <style>
      :root {
        --bg: #0b0d10;
        --panel: #0e1116;
        --sunk: #11151b;
        --line: #1e2732;
        --fg: #c8ced8;
        --bright: #e6ebf2;
        --dim: #7c8798;
        --faint: #4d5765;
        --ok: #7fd0a0;
        --bad: #d08a7f;
        --warn: #d8c07f;
        --sans: "Segoe UI", system-ui, sans-serif;
        --mono: Consolas, "DejaVu Sans Mono", monospace;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        padding: 0;
        min-height: 100%;
        background: var(--bg);
        color: var(--fg);
        font: 15px/1.45 var(--sans);
      }
      #brand {
        padding: 8px 10px;
        border-bottom: 1px solid var(--line);
        background: var(--panel);
        text-align: center;
      }
      #brand b {
        color: var(--bright);
        font-size: 15px;
        font-weight: 700;
        letter-spacing: 0.14em;
      }
      /* The live heap readout sits in the flow under the bar. Nothing here
         scrolls the document itself, so it stays in view without being
         positioned over the wordmark. */
      #ramBox {
        overflow: hidden;
        padding: 5px 10px;
        border-bottom: 1px solid var(--line);
        background: var(--sunk);
        color: var(--ok);
        font: 11px/1.4 var(--mono);
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      /* Running: a spinner under the bar. jb.js switches the body to .done,
         .fail or .log. */
      #spin {
        position: fixed;
        top: calc(50% + 20px);
        left: 50%;
        width: 46px;
        height: 46px;
        margin: -23px 0 0 -23px;
        border: 4px solid var(--line);
        border-top-color: var(--ok);
        border-radius: 50%;
        animation: spin 0.9s linear infinite;
      }
      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }
      #msg {
        position: fixed;
        top: 50%;
        left: 0;
        right: 0;
        transform: translateY(-50%);
        display: none;
        text-align: center;
        font-size: 16px;
        letter-spacing: 0.5px;
      }
      #state,
      #out {
        display: none;
      }
      body.done #spin,
      body.fail #spin {
        display: none;
      }
      body.fail #msg {
        display: block;
      }
      body.done #msg {
        display: block;
        color: var(--ok);
        font-weight: 700;
        letter-spacing: 2px;
      }
      /* ?log=1 -- the full step log. Laid out with flex rather than by
         subtracting a header height from 100vh. */
      body.log {
        display: flex;
        flex-direction: column;
        height: 100vh;
      }
      body.log #spin,
      body.log #msg {
        display: none;
      }
      body.log #wrap {
        display: flex;
        flex-direction: column;
        flex: 1;
        min-height: 0;
        padding: 14px 18px 30px;
      }
      body.log #state {
        display: block;
        margin: 0 0 8px;
        font-size: 22px;
        font-weight: 700;
      }
      body.log #out {
        display: block;
        flex: 1;
        min-height: 0;
        overflow-y: auto;
        padding: 10px 12px;
        border: 1px solid var(--line);
        border-radius: 5px;
        background: var(--sunk);
        font: 12px/1.45 var(--mono);
        white-space: pre-wrap;
      }
      /* The retry notice, raised by jb.js when the chain throws or stalls. */
      .notice {
        margin: 1em 0;
        padding: 0.7em 1em;
        border: 2px solid #e66;
        background: #2a1414;
        color: #f99;
        font: 700 20px/1.4 var(--sans);
      }
      .byline {
        position: fixed;
        bottom: 9px;
        left: 11px;
        margin: 0;
        color: var(--faint);
        font: 11px/1 var(--mono);
        letter-spacing: 0.06em;
      }
      .ok {
        color: var(--ok);
      }
      .bad {
        color: var(--bad);
      }
      .warn {
        color: var(--warn);
      }
      code {
        color: #9fb3d0;
      }
    .hk-wordmark{position:relative;display:inline-block;vertical-align:middle;text-align:left;white-space:nowrap;font-family:Arial,Helvetica,sans-serif;line-height:1;padding:3px 0 5px 19px;border:0}.hk-wordmark:before{content:"";position:absolute;left:2px;top:7px;width:4px;height:35px;background:#36c8f4;transform:skew(-13deg);box-shadow:6px 0 0 #ff7b25}.hk-wordmark .hk-name{display:block;font-size:30px;font-weight:900;font-style:italic;letter-spacing:3px;color:#55c8ef;text-shadow:0 2px 0 #123d58}.hk-wordmark .hk-lounge{display:flex;justify-content:space-between;margin-top:7px;padding-top:5px;border-top:1px solid #2e5266;font-size:11px;font-weight:900;font-style:normal;letter-spacing:0;color:#ff791e;text-shadow:0 0 8px rgba(255,121,30,.18)}.brand .hk-wordmark,.service-brand .hk-wordmark{flex-shrink:0}@supports (-webkit-background-clip:text){.hk-wordmark .hk-name{background:linear-gradient(180deg,#c3f2ff 0%,#58c5ed 42%,#2194ce 100%);-webkit-background-clip:text;-webkit-text-fill-color:transparent;text-shadow:none}}@media(max-width:480px){.hk-wordmark{padding-left:16px}.hk-wordmark .hk-name{font-size:25px;letter-spacing:2px}.hk-wordmark .hk-lounge{display:flex;justify-content:space-between;margin-top:7px;padding-top:5px;border-top:1px solid #2e5266;font-size:11px;font-weight:900;font-style:normal;letter-spacing:0;color:#ff791e;text-shadow:0 0 8px rgba(255,121,30,.18)}.hk-wordmark:before{height:31px;width:3px}}
#ramBox{display:none}.byline a{color:inherit}</style>
  </head>
  <body>
    <!-- jb.js owns the body class: .log while the step log is shown, .done or
         .fail once the chain has settled. The ids below are its contract --
         #ramBox, #msg, #state and #out are read by name. -->
    <div id="brand"><span class="hk-wordmark" role="img" aria-label="Halkent Gaming Lounge"><span class="hk-name">HALKENT</span><span class="hk-lounge" aria-hidden="true"><span>G</span><span>A</span><span>M</span><span>I</span><span>N</span><span>G</span><span>&nbsp;</span><span>L</span><span>O</span><span>U</span><span>N</span><span>G</span><span>E</span></span></span></div>
    <div id="ramBox">Bellek kontrol ediliyor...</div>
    <div id="spin"></div>
    <div id="msg">Konsolu yeniden başlatın</div>
    <div id="wrap">
      <div id="state"></div>
      <div id="out"></div>
    </div>
    <p class="byline">Halkent Gaming Lounge · <a href="https://github.com/halkent/ps4/tree/main/1402">Kaynak kodu ve lisanslar</a> · <a href="../">Sürüm seçimi</a></p>
    <script>
var match=/PlayStation\s+4[\/ ;]+(\d+\.\d{2})(?!\d)/i.exec(navigator.userAgent||'');
if(match && match[1]==='14.02'){var script=document.createElement('script');script.type='module';script.src='./jb.js';document.body.appendChild(script);}
else{document.body.className='fail';document.getElementById('msg').textContent=window.hkT('Bu işlem yalnızca PS4 14.02 tarayıcısında çalışır.');}
</script>
  </body>
</html>
